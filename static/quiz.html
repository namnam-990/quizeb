<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀴즈 풀기</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">📚 QuizApp</a>
    <div class="navbar-links">
      <a href="/" id="back-link">← 홈</a>
    </div>
  </nav>

  <!-- Quiz in progress -->
  <div id="quiz-view" class="quiz-container" style="display:none;">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progress-text">문제 1 / 1</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <h2 id="quiz-title" style="font-size:1.125rem; font-weight:600; color:var(--text-light); margin-bottom:1.25rem;"></h2>

    <div class="question-card">
      <div class="question-num" id="question-num">문제 1</div>
      <div class="question-text" id="question-text"></div>
      <div class="choices-list" id="choices-list"></div>
      <div id="feedback" style="display:none;"></div>
    </div>

    <div id="explanation-card" class="explanation-card" style="display:none;">
      <div class="explanation-header">
        <span id="explanation-loading" style="display:none;"><span class="spinner"></span> 해설 생성 중...</span>
        <span id="explanation-title" style="display:none;">💡 해설</span>
      </div>
      <div class="explanation-text" id="explanation-text"></div>
    </div>

    <div class="next-btn-wrap">
      <button id="next-btn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">
        다음 문제 →
      </button>
    </div>
  </div>

  <!-- Results -->
  <div id="results-view" style="display:none;">
    <div class="quiz-container">
      <div class="results-wrap">
        <div class="results-card">
          <div class="results-icon" id="results-icon">🎉</div>
          <h2 class="results-title">퀴즈 완료!</h2>
          <p class="results-subtitle" id="results-quiz-title"></p>
          <div class="results-score" id="results-score"></div>
          <p class="results-label">모든 문제를 맞혔습니다 ✓</p>
          <div class="results-actions">
            <button class="btn btn-outline" onclick="restartQuiz()">다시 풀기</button>
            <a id="results-back" href="/" class="btn btn-primary">목록으로</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading-view" class="quiz-container">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <script src="/static/js/quiz.js"></script>
</body>
</html>
