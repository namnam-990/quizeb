<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 퀴즈 앱</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">📚 QuizApp</a>
    <div class="navbar-links">
      <a href="/">← 메인으로</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">관리자</h1>
      <p class="page-subtitle">폴더와 퀴즈를 관리합니다.</p>
    </div>

    <div class="admin-layout">
      <!-- Folders panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">📁 폴더</span>
          <button class="btn btn-primary btn-sm" onclick="openFolderModal()">+ 추가</button>
        </div>
        <div class="panel-body">
          <div id="folder-list"><div class="loading"><div class="spinner"></div></div></div>
        </div>
      </div>

      <!-- Quizzes panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title" id="quiz-panel-title">📝 퀴즈</span>
          <div style="display:flex;gap:.5rem;">
            <button class="btn btn-outline btn-sm" id="bulk-quiz-btn" onclick="openBulkModal()" style="display:none;">{ } JSON 일괄 등록</button>
            <button class="btn btn-primary btn-sm" id="add-quiz-btn" onclick="openQuizModal()" style="display:none;">+ 퀴즈 추가</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="quiz-list">
            <div class="empty-state" style="padding:2rem 0;">
              <div class="empty-icon" style="font-size:2rem;">👈</div>
              <p class="empty-desc">왼쪽에서 폴더를 선택하세요.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Folder Modal -->
  <div class="modal-overlay" id="folder-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">새 폴더 만들기</h3>
        <button class="modal-close" onclick="closeFolderModal()">×</button>
      </div>
      <div class="form-group">
        <label class="form-label">폴더 이름</label>
        <input class="form-input" id="folder-name-input" placeholder="예: 수학, 영어, 역사..." onkeydown="if(event.key==='Enter') submitFolder()">
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeFolderModal()">취소</button>
        <button class="btn btn-primary" onclick="submitFolder()">만들기</button>
      </div>
    </div>
  </div>

  <!-- Quiz Modal -->
  <div class="modal-overlay" id="quiz-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">새 퀴즈 만들기</h3>
        <button class="modal-close" onclick="closeQuizModal()">×</button>
      </div>

      <div class="form-group">
        <label class="form-label">퀴즈 제목 *</label>
        <input class="form-input" id="quiz-title-input" placeholder="퀴즈 제목을 입력하세요">
      </div>
      <div class="form-group">
        <label class="form-label">설명 (선택)</label>
        <textarea class="form-input" id="quiz-desc-input" placeholder="퀴즈에 대한 간단한 설명"></textarea>
      </div>

      <div style="font-size:.8125rem; font-weight:600; color:var(--text-light); margin-bottom:.75rem; margin-top:1.25rem;">
        문제 목록 <span style="font-weight:400;">(정답 옆 ● 버튼 선택)</span>
      </div>

      <div id="questions-container"></div>
      <button class="add-q-btn" onclick="addQuestion()">+ 문제 추가</button>

      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeQuizModal()">취소</button>
        <button class="btn btn-primary" onclick="submitQuiz()">저장</button>
      </div>
    </div>
  </div>

  <!-- Bulk JSON Modal -->
  <div class="modal-overlay" id="bulk-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">JSON으로 퀴즈 일괄 등록</h3>
        <button class="modal-close" onclick="closeBulkModal()">×</button>
      </div>

      <p style="font-size:.8125rem;color:var(--text-light);margin-bottom:1rem;">
        퀴즈 배열 <code>[...]</code>, <code>{"quizzes": [...]}</code>, 또는 퀴즈 객체 하나를 넣을 수 있습니다.
        하나라도 오류가 있으면 아무것도 저장되지 않습니다.
      </p>

      <div class="form-group">
        <label class="form-label">JSON 파일 불러오기</label>
        <input type="file" class="form-input" id="bulk-file-input" accept=".json,application/json" onchange="loadBulkFile(this)">
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between;align-items:center;">
          <span>JSON 내용</span>
          <button type="button" class="btn btn-sm btn-outline" onclick="fillBulkExample()">예시 넣기</button>
        </label>
        <textarea class="form-input" id="bulk-json-input" spellcheck="false"
          style="min-height:260px;font-family:Consolas,monospace;font-size:.8125rem;"
          placeholder='[{"title": "...", "questions": [{"question_text": "...", "choices": [{"choice_text": "...", "is_correct": true}, ...]}]}]'></textarea>
      </div>

      <div id="bulk-errors" style="display:none;font-size:.8125rem;color:var(--danger);background:var(--danger-light);border-radius:8px;padding:.75rem 1rem;max-height:160px;overflow-y:auto;white-space:pre-wrap;"></div>

      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeBulkModal()">취소</button>
        <button class="btn btn-primary" id="bulk-submit-btn" onclick="submitBulk()">등록</button>
      </div>
    </div>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
