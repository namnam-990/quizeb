<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀴즈 목록</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">📚 QuizApp</a>
    <div class="navbar-links">
      <a href="/admin">관리자</a>
    </div>
  </nav>

  <div class="container">
    <div class="breadcrumb">
      <a href="/">홈</a>
      <span class="breadcrumb-sep">›</span>
      <span id="folder-name">폴더</span>
    </div>

    <div class="header-row">
      <div class="page-header" style="margin-bottom:0;">
        <h1 class="page-title" id="page-title">퀴즈 목록</h1>
        <p class="page-subtitle" id="page-subtitle">퀴즈를 선택하여 시작하세요.</p>
      </div>
    </div>

    <div id="loading" class="loading"><div class="spinner"></div></div>
    <div id="quizzes-grid" class="grid" style="display:none;"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <div class="empty-icon">📝</div>
      <div class="empty-title">퀴즈가 없습니다</div>
      <p class="empty-desc">관리자 페이지에서 이 폴더에 퀴즈를 추가해주세요.</p>
    </div>
  </div>

  <script src="/static/js/folder.js"></script>
</body>
</html>
